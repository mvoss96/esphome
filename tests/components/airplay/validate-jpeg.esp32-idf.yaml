# Cover art restricted to JPEG, without PSRAM
substitutions:
  i2s_dout_pin: GPIO22

packages:
  spi: !include ../../test_build_components/common/spi/esp32-idf.yaml
  i2s_audio: !include ../../test_build_components/common/i2s_audio/esp32-idf.yaml

  airplay: !include common.yaml

display:
  - platform: ili9xxx
    spi_id: spi_bus
    id: main_lcd
    model: ili9342
    cs_pin: 13
    dc_pin: 14
    reset_pin: 27
    invert_colors: true
    lambda: |-
      it.image(0, 0, id(airplay_cover));

image:
  - platform: airplay
    id: airplay_cover
    format: JPEG
    type: GRAYSCALE
    resize: 48x48
    max_size: 32kB
