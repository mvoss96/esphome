psram:
  mode: quad

wifi:
  ap:

speaker:
  - platform: i2s_audio
    id: airplay_speaker_id
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    sample_rate: 44100
    num_channels: 2

airplay:
  task_stack_in_psram: true
  airplay2: true
  airplay2_features: 0x1E040405C4A00

# Synchronized playback with the default buffer for boards with PSRAM
media_source:
  - platform: airplay
    id: airplay_source

media_player:
  - platform: speaker_source
    id: airplay_media_player
    name: AirPlay Media Player
    media_pipeline:
      speaker: airplay_speaker_id
      sources:
        - airplay_source
